[package]
name = "bridge-tally-transport"
version = "0.1.0"
description = "Portable, loopback-only bounded HTTP transport for Bridge Tally integration"
license = "Apache-2.0"
repository = "https://github.com/lamemustafa/bridge"
publish = false
edition = "2021"
rust-version = "1.96"

[features]
default = []
# Enables the sealed 40 MiB transport exception for the voucher-scan wildcard
# outstandings request. With this off, `post_outstandings_xml_decoded` and the
# raised response cap do not compile: no request exists that could use them,
# and a raised cap nothing can reach is a widened attack surface for nothing.
voucher-scan = ["bridge-tally-protocol/voucher-scan"]

[dependencies]
bridge-tally-protocol = { path = "../bridge-tally-protocol" }
reqwest = { version = "0.13", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
tally-protocol-simulator = { path = "../tally-protocol-simulator" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
