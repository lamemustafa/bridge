[package]
name = "bridge-tally-transport"
version = "0.1.0"
description = "Portable, loopback-only bounded HTTP transport for Bridge Tally integration"
license = "Apache-2.0"
repository = "https://github.com/lamemustafa/bridge"
publish = false
edition = "2021"
rust-version = "1.96"

[features]
default = []
# Only the desktop app needs the outstandings request type. Keeping it opt-in
# stops bridge-tally-core reaching bridge-tally-live-read transitively.
outstandings = ["bridge-tally-protocol/outstandings"]

[dependencies]
bridge-tally-protocol = { path = "../bridge-tally-protocol", default-features = false }
reqwest = { version = "0.13", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
tally-protocol-simulator = { path = "../tally-protocol-simulator" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
