[package]
name = "bridge-tax-audit"
version = "0.1.0"
description = "Reads a tally-read-v1 directory into an audit book and runs books-based tax-audit tests (first slice: cash_44ab) with canonical parity output"
license = "Apache-2.0"
repository = "https://github.com/lamemustafa/bridge"
publish = false
edition = "2021"
rust-version = "1.96"

[lints]
workspace = true

# A standalone workspace for now, on purpose. Joining the src-tauri workspace means editing
# src-tauri/Cargo.toml and src-tauri/Cargo.lock, which are both pinned in the compatibility
# surface; that is an owner decision batched with other pin-touching changes. Until then CI
# does not run this crate (see the crate docs in src/lib.rs). The lint table mirrors
# src-tauri/Cargo.toml's, the same way tools/Cargo.toml does.
[workspace]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }

[dependencies]
bridge-tally-primitives = { path = "../bridge-tally-primitives" }
bridge-tally-protocol = { path = "../bridge-tally-protocol" }
flate2 = "1"
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
toml = "0.9"
unicode-normalization = "0.1"
