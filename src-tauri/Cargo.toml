[package]
name = "bridge"
version = "0.2.0"
description = "Bridge is the open-source Tauri implementation of the AXAL Sync desktop workflows."
authors = ["AXAL"]
license = "Apache-2.0"
repository = "https://github.com/lamemustafa/bridge"
publish = false
edition = "2021"
rust-version = "1.96"
default-run = "bridge"

[features]
# Legacy voucher-scan outstandings path. Shipped/default builds take the
# native Bills Receivable/Payable + List of Ledgers path unconditionally;
# this gate exists so the ~4,800 lines of scan machinery (date/AlterID
# partitioning, segment completeness proofs, the wildcard voucher fetch) do
# not compile into a shipped build at all. Not a default feature.
voucher-scan = ["bridge-tally-protocol/voucher-scan", "bridge-tally-transport/voucher-scan"]
# Manual-only admission for the ignored, corpus-bound Unit A reconciliation
# harness. Shipped/default builds have no constructor for an AlterID width.
# The harness is what actually drives a voucher scan, so it implies the scan
# machinery it needs.
live-calibration-harness = ["voucher-scan"]

[workspace]
members = [
  ".",
  "crates/bridge-tally-core",
  "crates/bridge-tally-primitives",
  "crates/bridge-tally-protocol",
  "crates/bridge-tally-transport",
  "crates/tally-protocol-simulator",
]
resolver = "2"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[lib]
name = "bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "bridge"
path = "src/main.rs"

[[bin]]
name = "bridge-daemon"
path = "src/daemon.rs"

[[bin]]
name = "dsc_probe"
path = "src/bin/dsc_probe.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
async-trait = "0.1"
bridge-tally-core = { path = "crates/bridge-tally-core" }
bridge-tally-protocol = { path = "crates/bridge-tally-protocol" }
bridge-tally-transport = { path = "crates/bridge-tally-transport" }
chrono = { version = "0.4", features = ["serde"] }
cryptoki = "0.12"
getrandom = "0.4"
keyring = { version = "4.1.4", default-features = false, features = ["v1"] }
libsqlite3-sys = { version = "0.37.0", features = ["bundled-sqlcipher-vendored-openssl"] }
pkcs11 = "0.5"
quick-xml = { version = "0.41", features = ["serialize"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
# Bridge supports Windows and macOS; rfd's defaults add Linux portal/Wayland code.
rfd = { version = "0.17", default-features = false }
rust_xlsxwriter = { version = "0.98.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "chrono", "uuid"] }
tauri = { version = "2", features = [] }
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
x509-parser = "0.18"
zeroize = "1"
pdf-writer = "0.15.0"

[dev-dependencies]
tally-protocol-simulator = { path = "crates/tally-protocol-simulator" }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }
