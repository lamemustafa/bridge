name: Dependency Security

on:
  push:
    # Only master, for the reason ci.yml gives: a branch worth auditing has a
    # pull request, and that is what triggers below.
    branches: [master]
  pull_request:
    # Unfiltered by base branch, matching ci.yml. Filtering to `[master]` left
    # a pull request stacked on another branch with no audit at all until its
    # root merged -- and a PR with no audit still reports a green mergeable
    # state, because nothing required failed. A dependency advisory is worth
    # hearing about on the PR that introduces it, not several PRs later.
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
      - name: Audit production frontend dependencies
        run: corepack pnpm run security:audit:frontend
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - name: Audit locked Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock
      # The tools workspace has its own lockfile. Auditing only the app's let
      # RUSTSEC-2026-0285 (rustls) sit unreported in tools/Cargo.lock after the
      # app lockfile was patched. `if: always()` so an app finding does not hide
      # a tools finding on the same pull request.
      - name: Audit locked Rust tools dependencies
        if: always()
        run: cargo audit --file tools/Cargo.lock
