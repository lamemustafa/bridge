name: Tax-audit mutations (nightly)

# The bridge-tax-audit crate records every mutation written against it in
# parity/mutations.json. A pull request re-proves only the mutations its change
# selects (parity/mutations.py --verify, in ci.yml). This run re-proves the
# WHOLE list against the FULL suite on master, so a mutation whose killing tests
# were weakened by a change elsewhere in the crate is caught within a day. Any
# mutation not killed, not run, or with a stale committed record fails the run
# and opens (or updates) one tracking issue labelled `mutation-nightly`; a crate
# pull request fails ci.yml's mutation check while that issue is open.
on:
  schedule:
    - cron: "23 21 * * *" # daily, off the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Not cancel-in-progress: the report job writes to an issue in two steps, and a
  # cancelled half-run would leave it half-updated.
  group: tax-audit-mutations-nightly
  cancel-in-progress: false

jobs:
  shard:
    name: Mutations, shard ${{ matrix.shard }} of 8
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0
      # The whole list, the full suite each time: a survivor verdict must never come
      # from a subset of the tests. This step does not judge (its exit status is
      # tee's): the report job judges every shard's results file together.
      - name: Run this shard's mutations
        run: |
          python3 src-tauri/crates/bridge-tax-audit/parity/mutations.py \
            --full --jobs 2 --shard "${{ matrix.shard }}/8" \
            --workdir "$RUNNER_TEMP/mutants" \
            --results "$RUNNER_TEMP/shard-${{ matrix.shard }}.json" | tee "$RUNNER_TEMP/shard-${{ matrix.shard }}.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/shard-${{ matrix.shard }}.json
            ${{ runner.temp }}/shard-${{ matrix.shard }}.log
          if-no-files-found: warn
          retention-days: 14

  report:
    name: Judge every shard and track failures in one issue
    needs: shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-shard-*
          path: shards
          merge-multiple: true
      # A shard that crashed before writing its file is not a clean shard: its
      # mutations are simply absent from the merge, and the report lists them as
      # "not run", which fails the run.
      - name: Merge the shards and judge the whole list
        id: judge
        run: |
          set +e
          shopt -s nullglob
          files=(shards/shard-*.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no shard wrote a results file" > report.md
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if python3 src-tauri/crates/bridge-tax-audit/parity/mutations.py \
            --merge "${files[@]}" --results mutation-results.json --report report.md; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-results
          path: |
            mutation-results.json
            report.md
          if-no-files-found: warn
          retention-days: 30
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ steps.judge.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create mutation-nightly --color B60205 \
            --description "The nightly bridge-tax-audit mutation run failed" --force
          open="$(gh issue list --label mutation-nightly --state open --limit 100 --json number --jq '.[0].number // empty')"
          { cat report.md; echo; echo "Run: $RUN_URL"; } > body.md
          if [ "$FAILED" = "true" ]; then
            if [ -n "$open" ]; then
              gh issue comment "$open" --body-file body.md
            else
              gh issue create --label mutation-nightly \
                --title "Nightly tax-audit mutation run failed" --body-file body.md
            fi
            exit 1
          fi
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "The nightly run passed: every mutation killed on master. $RUN_URL"
            gh issue close "$open"
          fi
