name: macOS dependency cache input audit

on:
  push:
    branches: [tapish-codex/macos-dependency-cache-audit-20260909]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Read macOS cached dependency inputs
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0
      - name: Restore current packaging cache read-only
        id: dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: bundle-smoke
          workspaces: src-tauri -> target
          save-if: false
      - name: Inspect recorded native compiler inputs without building
        env:
          DEPENDENCY_CACHE_EXACT_HIT: ${{ steps.dependencies.outputs.cache-hit }}
        run: python3 scripts/audit-macos-cache-inputs.py
      - name: Retain cache audit
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiler-cache-dependency-audit-macos
          path: cache-input-audit/**
          if-no-files-found: error
          retention-days: 7
