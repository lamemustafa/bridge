name: Windows Perl inventory and cold correctness experiment

on:
  push:
    branches: [tapish-codex/windows-perl-inventory-20260909]

permissions:
  contents: read

concurrency:
  group: windows-perl-inventory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    name: Inventory unchanged pinned Windows Perl
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Restore normal Windows prerequisites without saving a cache
        id: prerequisites
        uses: ./.github/actions/setup-windows-native
        with:
          save-cache: "false"
      - name: Inventory installed distribution
        shell: pwsh
        env:
          PERL_CACHE_HIT: ${{ steps.prerequisites.outputs.cache-hit }}
        run: >-
          python scripts/inventory-windows-perl.py
          --root 'C:\Strawberry'
          --output "$env:RUNNER_TEMP/perl-inventory/installed.json.gz"
      - name: Retain inventory metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-perl-installed-inventory
          path: ${{ runner.temp }}/perl-inventory/installed.json.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  cold-correctness:
    name: Cold native correctness (${{ matrix.case }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        case: [full, reduced]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0
      - name: Restore unchanged native prerequisites without saving
        id: prerequisites
        uses: ./.github/actions/setup-windows-native
        with:
          save-cache: "false"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          save-if: "false"
      - name: Check directory restoration controls
        run: python scripts/measure-perl-cold.test.py
      - name: Rebuild native dependencies and run the existing cipher test
        env:
          PERL_CACHE_HIT: ${{ steps.prerequisites.outputs.cache-hit }}
        run: python scripts/measure-perl-cold.py --case ${{ matrix.case }}
      - name: Retain correctness and restoration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-perl-cold-${{ matrix.case }}
          path: perl-cold-measurements/${{ matrix.case }}/**
          if-no-files-found: error
          retention-days: 7
