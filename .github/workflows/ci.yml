name: Bridge CI

on:
  push:
    # Only master. A branch push needs no run of its own: a branch worth
    # checking has a pull request, and that is what triggers below.
    branches: [master]
  pull_request:
    # Deliberately unfiltered by base branch. Filtering to `[master]` meant a
    # pull request stacked on another branch got no run at all, and reported
    # `mergeStateStatus: CLEAN` off the one check that is not this workflow --
    # a green that said only "nothing required failed", never "the suite ran".
    # A stack then accumulated unchecked changes until its root merged, so the
    # first real run faced several pull requests' worth of change at once.
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Determine bundle scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      bundle: ${{ steps.scope.outputs.bundle }}
      native: ${{ steps.scope.outputs.native }}
      tax_audit: ${{ steps.scope.outputs.tax_audit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo 'bundle=true' >> "$GITHUB_OUTPUT"
            echo 'native=true' >> "$GITHUB_OUTPUT"
            echo 'tax_audit=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          # A new branch has no useful predecessor. Keep the conservative path.
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo 'bundle=true' >> "$GITHUB_OUTPUT"
            echo 'native=true' >> "$GITHUB_OUTPUT"
            echo 'tax_audit=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --no-renames lists a moved file under both paths, so a file moved out of a gated directory still selects it.
          # -z: git would otherwise quote a path with non-ASCII bytes, and the quoted form matches no prefix below.
          changed_files="$(git diff --name-only --no-renames -z "$base" "$GITHUB_SHA" | tr '\0' '\n')"
          if printf '%s\n' "$changed_files" | grep -Eq '^(\.github/workflows/|\.github/actions/setup-windows-native/|rust-toolchain\.toml|src-tauri/|tools/|scripts/package-mcpb\.mjs|scripts/check-no-test-seam(\.test)?\.mjs)'; then
            echo 'native=true' >> "$GITHUB_OUTPUT"
          else
            echo 'native=false' >> "$GITHUB_OUTPUT"
          fi

          # The mutation records check runs when the crate it guards changes, or this workflow does.
          if printf '%s\n' "$changed_files" | grep -Eq '^(\.github/workflows/ci\.yml|src-tauri/crates/bridge-tax-audit/)'; then
            echo 'tax_audit=true' >> "$GITHUB_OUTPUT"
          else
            echo 'tax_audit=false' >> "$GITHUB_OUTPUT"
          fi

          # tools/ is deliberately excluded: it is not shipped in the bundle, which validates the artifact and its resources.
          if printf '%s\n' "$changed_files" | grep -Eq '^(\.github/workflows/ci\.yml|\.github/actions/setup-windows-native/|packaging/mcpb/|package\.json|pnpm-lock\.yaml|\.node-version|vite\.config\.ts|tsconfig\.json|postcss\.config\.js|index\.html|src/|src-tauri/(src/|crates/|Cargo\.lock|Cargo\.toml|.*/Cargo\.toml|tauri\.conf\.json|build\.rs|icons/)|LICENSE$|NOTICE$|THIRD_PARTY_LICENSES\.txt$|THIRD_PARTY_LICENSES_RUST\.txt$|packaging/pdfium/|scripts/(fetch-pdfium(\.test)?\.py|capture-package-log(\.test)?\.py|check-mcpb-bundle(\.test)?\.py|package-mcpb\.mjs|check-license-metadata\.mjs|check-dependency-inventory\.mjs|check-windows-bundle-resources\.ps1|check-macos-bundle-resources(\.mutation)?\.mjs|check-no-test-seam(\.test)?\.mjs)$|\.cargo/|src-tauri/\.cargo/)'; then
            echo 'bundle=true' >> "$GITHUB_OUTPUT"
          else
            echo 'bundle=false' >> "$GITHUB_OUTPUT"
          fi

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run license:check
      - run: corepack pnpm exec playwright install --with-deps chromium webkit
      - run: corepack pnpm test
      - run: corepack pnpm run build

  rust-format:
    name: Rust format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: node scripts/check-dependency-inventory.mjs --rust

  workflow-consistency:
    name: Workflow consistency
    runs-on: ubuntu-latest
    # Allow the full suite and setup to finish on slower runners while retaining
    # a bounded job timeout.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # check-protocol-section-numbers.mjs compares the reference against its
          # base to enforce never-renumber; a shallow clone has no base to read,
          # and the check says so and skips rather than passing quietly.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0
      - name: Require pinned Rust for reseal regressions
        run: rustup which --toolchain 1.96.0 rustc
      - run: node scripts/check-ci-workflow-consistency.mjs
      - name: Test reseal and merge-driver regressions
        run: node --test scripts/reseal.test.mjs scripts/reseal-merge-driver.test.mjs
      - run: node scripts/check-protocol-section-numbers.mjs
      - run: node scripts/check-protocol-section-numbers.test.mjs
      - run: node --test scripts/prune-package-compiler-cache.test.mjs
      - run: python3 scripts/collect-macos-test-crashes.test.py
      - run: python3 scripts/retain-macos-test-binaries.test.py
      - run: python3 scripts/bank_statement_import.test.py
      - run: python3 scripts/fetch-pdfium.test.py
      # the committed statement PDFs are this generator's output, byte for byte
      - run: python3 scripts/generate-bank-statement-fixtures.py src-tauri/crates/bridge-bank-statement/tests/fixtures --check
      - run: python3 scripts/sanitise-bbox-capture.test.py
      - run: python3 scripts/merge-gate.test.py
      - run: python3 scripts/surface_coverage_report.test.py

  tally-portable:
    name: Tally portable core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            src-tauri -> target
            tools -> target
      - name: Test portable Tally truth layer
        working-directory: src-tauri
        run: >-
          cargo test --locked --no-fail-fast
          -p bridge-tally-core
          -p bridge-tally-protocol
          -p bridge-tally-transport
          -p tally-protocol-simulator
      - name: Test portable Tally qualification tools
        working-directory: tools
        run: cargo test --locked --workspace --no-fail-fast
      - name: Test disabled protocol evidence features
        working-directory: src-tauri
        run: >-
          cargo test --locked -p bridge-tally-protocol --no-fail-fast
          --features jsonex-parser,jsonex-request-builder,india-tax-observation-parser,bills-payments-observation-parser,bills-native-outstandings-probe
      # The legacy voucher-scan outstandings path is compiled out of shipped
      # builds. Its tests exist only under the feature, so run them here.
      - name: Test legacy voucher-scan outstandings path
        working-directory: src-tauri
        run: |
          cargo test --locked -p bridge-tally-protocol --features voucher-scan --no-fail-fast
          cargo test --locked -p bridge-tally-transport --features voucher-scan --no-fail-fast
      - name: Test isolated native outstandings qualification path
        working-directory: tools
        run: |
          cargo test --locked -p bridge-tally-compatibility --features bills-native-outstandings-probe-receipt
          cargo test --locked -p bridge-tally-read-transport --features bills-native-outstandings-probe-transport
          cargo test --locked -p bridge-tally-live-read --features bills-native-outstandings-probe-runner -- --test-threads=1
      - name: Lint portable Tally truth layer
        working-directory: src-tauri
        run: >-
          cargo clippy --locked
          -p bridge-tally-core
          -p bridge-tally-protocol
          -p bridge-tally-transport
          -p tally-protocol-simulator
          --all-targets -- -D warnings -A clippy::pedantic
      - name: Lint portable Tally qualification tools
        working-directory: tools
        run: cargo clippy --locked --workspace --all-targets -- -D warnings -A clippy::pedantic
      - name: Lint disabled protocol evidence features
        working-directory: src-tauri
        run: >-
          cargo clippy --locked -p bridge-tally-protocol
          --features jsonex-parser,jsonex-request-builder,india-tax-observation-parser,bills-payments-observation-parser,bills-native-outstandings-probe
          --all-targets -- -D warnings -A clippy::pedantic
      - name: Lint legacy voucher-scan outstandings path
        working-directory: src-tauri
        run: |
          cargo clippy --locked -p bridge-tally-protocol --features voucher-scan --all-targets -- -D warnings -A clippy::pedantic
          cargo clippy --locked -p bridge-tally-transport --features voucher-scan --all-targets -- -D warnings -A clippy::pedantic
      - name: Lint isolated native outstandings qualification path
        working-directory: tools
        run: |
          cargo clippy --locked -p bridge-tally-compatibility --features bills-native-outstandings-probe-receipt --all-targets -- -D warnings -A clippy::pedantic
          cargo clippy --locked -p bridge-tally-read-transport --features bills-native-outstandings-probe-transport --all-targets -- -D warnings -A clippy::pedantic
          cargo clippy --locked -p bridge-tally-live-read --features bills-native-outstandings-probe-runner --all-targets -- -D warnings -A clippy::pedantic
      - name: Produce parser-only synthetic qualification smoke receipt
        working-directory: tools
        run: >-
          cargo run --locked --release -p bridge-tally-qualification --
          run ci-smoke target/tally-qualification-smoke.json 7 3
      - name: Enforce exact Tally compatibility claims
        working-directory: tools
        run: >-
          cargo run --locked -p bridge-tally-compatibility --
          gate
          ../docs/tally/compatibility/compatibility-matrix.json
          ../docs/tally/compatibility/compatibility-surface.json
          ../docs/tally/compatibility/trusted-evidence-keys.json
          ../docs/tally/compatibility/evidence
          ..
      - name: Reject generated Tally matrix drift
        working-directory: tools
        run: >-
          cargo run --locked -p bridge-tally-compatibility --
          check-matrix-markdown
          ../docs/tally/compatibility/compatibility-matrix.json
          ../docs/tally/support-matrix.md
      - name: Enforce no-write live-read dependency boundary
        run: node scripts/check-tally-live-read-boundary.mjs
      - name: Enforce Tally-path egress boundary
        run: node scripts/check-tally-egress-boundary.mjs
      - name: Enforce fixture byte integrity
        run: node scripts/check-fixture-byte-integrity.mjs
      - name: Enforce fixture provenance
        run: node scripts/check-fixture-provenance.mjs
      - name: Enforce Tally request-builder hazard allowlist
        run: node scripts/check-tally-request-builder-hazards.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tally-parser-qualification-smoke
          path: tools/target/tally-qualification-smoke.json
          if-no-files-found: error
          retention-days: 7

  native:
    name: Native checks (${{ matrix.os }})
    needs: changes
    # Rust/Tauri changes always receive Windows and macOS coverage on PRs. The
    # check is deliberately skipped only for frontend- and documentation-only PRs.
    if: github.event_name != 'pull_request' || needs.changes.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    # CI does not debug native test executables. Keep local line tables and
    # release profiles unchanged; assertions and overflow checks stay enabled.
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    # A cold Windows native build already consumed the former 35-minute budget
    # before the final isolated qualification test could complete. Keep a hard
    # bound, but reserve time for every required compile, test, and lint gate.
    timeout-minutes: 50
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0
          components: clippy
      - name: Install pinned nextest
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-nextest@0.9.143
          fallback: none
      - name: Set up Windows native prerequisites
        id: windows-native-prerequisites
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-native
        with:
          save-cache: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        id: native-cache
        with:
          workspaces: |
            src-tauri -> target
            tools -> target
          # Separate the Windows dependency artifacts from the former registry-only
          # cache. Keep Cargo/toolchain/profile fingerprints and cleanup defaults;
          # workspace binaries and incremental artifacts are not persisted.
          key: ${{ runner.os == 'Windows' && format('native-deps-v1-{0}', hashFiles('.github/actions/setup-windows-native/action.yml')) || '' }}
          env-vars: ${{ runner.os == 'Windows' && 'ImageOS ImageVersion OPENSSL LIBCLANG' || '' }}
          # PRs consume trusted base caches. Manual branch runs can measure cold
          # and warm reuse in their own scope before a change reaches master.
          save-if: ${{ runner.os != 'Windows' || github.event_name != 'pull_request' }}
      - name: Record Windows prerequisite cache state
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### Windows native cache'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Dependency cache exact hit: `${{ steps.native-cache.outputs.cache-hit }}`'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Runner image: $env:ImageOS / $env:ImageVersion"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Strawberry Perl cache hit: `${{ steps.windows-native-prerequisites.outputs.cache-hit }}`'
      - name: Mark macOS test crash capture boundary
        id: native-crash-boundary
        if: runner.os == 'macOS'
        run: touch "$RUNNER_TEMP/bridge-native-start"
      - name: Test native workspace
        id: native-tests
        run: >-
          cargo nextest run --locked --manifest-path src-tauri/Cargo.toml
          --workspace --no-fail-fast --retries 0 --test-threads num-cpus --timings
      - name: Collect minimized macOS test crash stacks
        if: ${{ always() && runner.os == 'macOS' && steps.native-crash-boundary.outcome == 'success' }}
        run: >-
          python3 scripts/collect-macos-test-crashes.py
          --since-file "$RUNNER_TEMP/bridge-native-start"
          --output "$RUNNER_TEMP/bridge-native-crashes.json"
          --wait-seconds ${{ steps.native-tests.outcome == 'failure' && '30' || '0' }}
      - name: Retain minimized macOS test crash stacks
        if: ${{ always() && runner.os == 'macOS' && steps.native-crash-boundary.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-crash-stacks-macos
          path: ${{ runner.temp }}/bridge-native-crashes.json
          if-no-files-found: error
          retention-days: 7
      - name: Link failed macOS test images to retained executables
        if: ${{ always() && runner.os == 'macOS' && steps.native-tests.outcome == 'failure' }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/retain-macos-test-binaries.py
          --crash-json "$RUNNER_TEMP/bridge-native-crashes.json"
          --target src-tauri/target/debug/deps
          --output "$RUNNER_TEMP/bridge-native-binaries"
      - name: Retain failed macOS executable evidence
        if: ${{ always() && runner.os == 'macOS' && steps.native-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-crash-binaries-macos
          path: ${{ runner.temp }}/bridge-native-binaries
          if-no-files-found: error
          retention-days: 7
      # The statement parser loads PDFium, a native library. Its PDF tests are
      # #[ignore]d in the default run so a machine without the library still
      # passes; here the pinned build is fetched, verified against the SHA-256
      # in packaging/pdfium/pdfium.lock.json before extraction, and the ignored
      # tests are run on their own. Without the variable they fail, not skip.
      - name: Fetch pinned PDFium
        shell: bash
        run: >-
          "$(command -v python3 || command -v python)" scripts/fetch-pdfium.py
          --platform ${{ runner.os == 'Windows' && 'windows-x64' || 'macos-arm64' }}
          --dest "$RUNNER_TEMP/pdfium" --github-env "$GITHUB_ENV"
      - name: Test PDF extraction through PDFium
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml -p bridge-bank-statement --no-fail-fast -- --ignored
          cargo test --locked --manifest-path src-tauri/Cargo.toml -p bridge --lib --no-fail-fast -- --ignored bank_statement a_parsed_statement_builds_an_import_file_by_proposals_id
      # Nextest does not execute doctests. Keep these as a separate required step.
      # bridge#583: the test-only approval seam must be visible to the scan
      # that proves shipped binaries lack it. This reuses the unit-test build
      # above and fails if that executable does not hold the seam's marker.
      - name: Prove the approval-seam scan sees a test build
        shell: bash
        run: node scripts/check-no-test-seam.mjs --test-harness
      - name: Test native workspace doctests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --workspace --doc --no-fail-fast
      - name: Test Tally qualification tools workspace
        working-directory: tools
        run: cargo test --locked --workspace --no-fail-fast
      - name: Test isolated native outstandings qualification feature
        working-directory: tools
        run: >-
          cargo test --locked -p bridge-tally-live-read
          --features bills-native-outstandings-probe-runner
          --all-targets -- --test-threads=1
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --workspace --all-targets --timings -- -D warnings -A clippy::pedantic
      # The legacy voucher-scan runtime and the manual Unit A calibration harness
      # are non-default features, so the workspace steps above never compile
      # them. Each feature set carries tests the other lacks: the default-width
      # invariant exists only without the harness, and the harness constructor
      # tests only with it. The code is platform-neutral, so macOS alone runs it.
      # The test step runs only tally:: and unit_a_live, where every gated test
      # lives; the rest of the suite already ran above. The guard fails if a cfg
      # on either feature appears anywhere else, so a gated test added outside
      # the filter cannot pass unrun. bulk_party_statement.rs only gates a
      # compile_fail doctest, which nextest never runs.
      - name: Guard legacy feature test filter scope
        if: runner.os == 'macOS'
        run: |
          outside=$(git grep -l -E 'feature *= *"(voucher-scan|live-calibration-harness)"' -- src-tauri/src src-tauri/tests \
            | grep -v -x -E 'src-tauri/src/tally/.*|src-tauri/tests/unit_a_live\.rs|src-tauri/src/reports/bulk_party_statement\.rs' || true)
          if [ -n "$outside" ]; then
            echo "Feature-gated code outside the nextest filter; widen the filter below:"
            echo "$outside"
            exit 1
          fi
      - name: Test legacy voucher-scan and calibration harness features
        if: runner.os == 'macOS'
        run: |
          cargo nextest run --locked --manifest-path src-tauri/Cargo.toml -p bridge --features voucher-scan --no-fail-fast --retries 0 --test-threads num-cpus -E 'test(/^tally::/) | binary(unit_a_live)'
          cargo nextest run --locked --manifest-path src-tauri/Cargo.toml -p bridge --features live-calibration-harness --no-fail-fast --retries 0 --test-threads num-cpus -E 'test(/^tally::/) | binary(unit_a_live)'
      - name: Lint legacy voucher-scan and calibration harness features
        if: runner.os == 'macOS'
        run: |
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml -p bridge --features voucher-scan --all-targets -- -D warnings -A clippy::pedantic
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml -p bridge --features live-calibration-harness --all-targets -- -D warnings -A clippy::pedantic
      - name: Lint Tally qualification tools workspace
        working-directory: tools
        run: cargo clippy --locked --workspace --all-targets -- -D warnings -A clippy::pedantic
      - name: Lint isolated native outstandings qualification feature
        working-directory: tools
        run: >-
          cargo clippy --locked -p bridge-tally-live-read
          --features bills-native-outstandings-probe-runner
          --all-targets -- -D warnings -A clippy::pedantic

      - name: Retain native compiler timings
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-compiler-timings-${{ matrix.os }}
          path: src-tauri/target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 7

  bundle-smoke:
    name: Bundle smoke (${{ matrix.os }})
    needs: changes
    # Bundle output is validated for packaging-relevant pull requests and every
    # master/manual run. Rust/Tauri PRs retain the native platform matrix above.
    if: github.event_name != 'pull_request' || needs.changes.outputs.bundle == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.cache/bridge-package-sccache
      SCCACHE_CACHE_SIZE: 64M
      SCCACHE_LOCAL_RW_MODE: ${{ github.ref == 'refs/heads/master' && 'READ_WRITE' || 'READ_ONLY' }}
      # bridge#723: the default 600s idle shutdown can fire between the last
      # compile and the statistics step. `--show-stats` then reports zeroed
      # statistics with exit 0, and only `--stop-server` notices the server is
      # gone. Keep the server alive for the job, so a server missing at that
      # step means it crashed.
      SCCACHE_IDLE_TIMEOUT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0
      - name: Match macOS cache inputs to the Tauri deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const target = config.bundle?.macOS?.minimumSystemVersion;
          if (typeof target !== 'string' || !/^\d+\.\d+(?:\.\d+)?$/.test(target)) {
            throw new Error('Expected an explicit macOS minimumSystemVersion in tauri.conf.json');
          }
          appendFileSync(process.env.GITHUB_ENV, `MACOSX_DEPLOYMENT_TARGET=${target}\n`);
          JS
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          # Tauri sets this inside its process; include it before cache lookup so
          # artifacts from a plain Cargo build cannot masquerade as a warm bundle.
          env-vars: ${{ runner.os == 'macOS' && 'MACOSX_DEPLOYMENT_TARGET' || '' }}
      - name: Set up Windows native prerequisites
        id: windows-bundle-prerequisites
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-native
      - name: Record Windows prerequisite cache state
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### Windows native prerequisites'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Strawberry Perl cache hit: `${{ steps.windows-bundle-prerequisites.outputs.cache-hit }}`'
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run license:all
      - name: Install pinned package compiler cache
        id: package-sccache
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: sccache@0.17.0
          fallback: none
      - name: Restore package compiler objects
        id: package-sccache-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: bridge-package-sccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            bridge-package-sccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}-
      - name: Start package compiler cache statistics
        id: package-sccache-start
        run: sccache --zero-stats
      - name: Use ad-hoc signing for macOS smoke bundles
        if: runner.os == 'macOS'
        run: echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
      - run: corepack pnpm run tauri:build
        if: runner.os != 'macOS'
        env:
          CARGO_INCREMENTAL: '0'
          RUSTC_WORKSPACE_WRAPPER: sccache
      - name: Build macOS bundles with child diagnostics
        id: macos-bundle
        if: runner.os == 'macOS'
        env:
          CARGO_INCREMENTAL: '0'
          RUSTC_WORKSPACE_WRAPPER: sccache
          # Pinned Tauri CLI logs bundle_dmg.sh stdout/stderr only at debug.
          TAURI_CLI_VERBOSITY: '1'
        run: |
          python3 scripts/capture-package-log.test.py
          set -o pipefail
          corepack pnpm run tauri:build -- --timings 2>&1 | python3 scripts/capture-package-log.py
      - name: Collect failed macOS bundle context
        if: ${{ failure() && runner.os == 'macOS' && steps.macos-bundle.outcome == 'failure' }}
        run: |
          mkdir -p package-diagnostics
          hdiutil info > package-diagnostics/disk-images.txt 2>&1
          df -h . > package-diagnostics/disk-space.txt 2>&1
      - name: Retain macOS package diagnostics
        if: ${{ always() && runner.os == 'macOS' && (steps.macos-bundle.outcome == 'success' || steps.macos-bundle.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-package-diagnostics
          path: |
            package-diagnostics/**
            src-tauri/target/release/bundle/dmg/bundle_dmg.sh
            src-tauri/target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 7
      - name: Verify Windows installer legal resources
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-windows-bundle-resources.ps1
      - name: Verify macOS app legal resources and signature
        if: runner.os == 'macOS'
        run: |
          node scripts/check-macos-bundle-resources.mjs
          node scripts/check-macos-bundle-resources.mutation.mjs
      # parse_bank_statement loads PDFium from beside bridge_mcp, so the bundle
      # carries the pinned build. fetch-pdfium.py verifies the archive, the
      # library and the licence notice it writes against the lock before use.
      - name: Fetch pinned PDFium for the MCPB
        shell: bash
        run: >-
          "$(command -v python3 || command -v python)" scripts/fetch-pdfium.py
          --platform ${{ runner.os == 'Windows' && 'windows-x64' || 'macos-arm64' }}
          --dest "$RUNNER_TEMP/mcpb-pdfium"
      # tauri build uses --bins, including the auto-discovered bridge_mcp.
      # Stage that fresh release binary instead of rebuilding without Tauri's
      # custom-protocol feature and native build environment.
      # bridge#583: no shipped executable may hold the test-only approval seam.
      # tauri build already ran this as its beforeBundleCommand; it is repeated
      # here on the exact files uploaded, and on the release-profile unit-test
      # executable as the positive control that the optimiser keeps the marker.
      - name: Prove shipped executables lack the test-only approval seam
        shell: bash
        run: |
          set -euo pipefail
          ext="${{ runner.os == 'Windows' && '.exe' || '' }}"
          node scripts/check-no-test-seam.mjs "src-tauri/target/release/bridge$ext" "src-tauri/target/release/bridge_mcp$ext"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            node scripts/check-no-test-seam.mjs src-tauri/target/release/bundle/macos
          fi
          node scripts/check-no-test-seam.mjs --test-harness --release
      - name: Stage host MCPB binary, PDFium and legal resources
        shell: bash
        run: >-
          node scripts/package-mcpb.mjs
          --binary src-tauri/target/release/bridge_mcp${{ runner.os == 'Windows' && '.exe' || '' }}
          --pdfium "$RUNNER_TEMP/mcpb-pdfium"
      - name: Validate and pack MCPB with the official schema
        run: |
          npx --yes @anthropic-ai/mcpb@2.1.2 validate packaging/mcpb/stage/manifest.json
          npx --yes @anthropic-ai/mcpb@2.1.2 pack packaging/mcpb/stage src-tauri/target/release/bundle/bridge-tally.mcpb
          npx --yes @anthropic-ai/mcpb@2.1.2 info src-tauri/target/release/bundle/bridge-tally.mcpb
      - name: Exercise the packaged MCPB stdio server
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python_command=python
          else
            python_command=python3
          fi
          "$python_command" scripts/check-mcpb-bundle.test.py
          "$python_command" scripts/check-mcpb-bundle.py src-tauri/target/release/bundle/bridge-tally.mcpb --output src-tauri/target/release/bundle/mcpb-smoke.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-bundle-smoke-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 7
      - name: Retain package compiler cache statistics
        id: package-sccache-stats
        if: ${{ always() && steps.package-sccache-start.outcome == 'success' }}
        shell: bash
        # --stop-server stays strict: it is the only proof that --show-stats
        # read the live server rather than inventing zeroed statistics.
        run: |
          sccache --show-stats --stats-format json > package-compiler-cache.json
          sccache --stop-server
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const writes = JSON.parse(readFileSync('package-compiler-cache.json', 'utf8')).stats.cache_writes;
          if (!Number.isSafeInteger(writes) || writes < 0) throw new Error('Invalid compiler-cache write count');
          appendFileSync(process.env.GITHUB_OUTPUT, `has-writes=${writes > 0}\n`);
          JS
      - name: Upload package compiler cache statistics
        if: ${{ always() && steps.package-sccache-start.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-compiler-cache-${{ matrix.os }}
          path: package-compiler-cache.json
          if-no-files-found: error
          retention-days: 7
      - name: Save qualified master compiler objects
        if: ${{ success() && github.ref == 'refs/heads/master' && steps.package-sccache-stats.outputs.has-writes == 'true' && steps.package-sccache-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ steps.package-sccache-cache.outputs.cache-primary-key }}

  compiler-cache-retention:
    name: Retain two compiler-cache snapshots per OS
    needs: [bundle-smoke, workflow-consistency]
    if: ${{ always() && github.ref == 'refs/heads/master' && needs.workflow-consistency.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    concurrency:
      group: package-compiler-cache-retention
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
      - name: Prune only obsolete master package compiler objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prune-package-compiler-cache.mjs --apply

  tax-audit-mutations:
    name: Tax-audit mutation records
    # No build: this checks the committed results file, never re-runs a mutation.
    # parity/mutations.py's docstring states the guarantee it enforces. Required,
    # but only on a pull request that touches the crate (or this workflow): a
    # master left inconsistent by a merge that bypassed it then reds crate PRs and
    # the nightly run, not every unrelated PR.
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.tax_audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test the mutation runner
        run: python3 -m unittest discover -s src-tauri/crates/bridge-tax-audit/parity -p 'test_mutations.py'
      # The nightly run writes the ids it found failing into its open tracking issue.
      - name: Read any open nightly mutation issue
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue list --repo "$GITHUB_REPOSITORY" --label mutation-nightly --state open --limit 100 \
            --json number,body --jq '.[] | "<!-- mutation-nightly-issue \(.number) -->\n\(.body)\n"' \
            > "$RUNNER_TEMP/nightly-issues.txt"
      # Every mutation applies exactly once, no record outlives its mutation, and every
      # mutation this change selects has a killed record made on exactly this merged
      # crate tree. While a nightly issue is open, a crate change must also re-prove
      # every mutation it lists as failing, so the fix merges and nothing else does.
      - name: Check the change's mutations are proven on this tree
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python3 src-tauri/crates/bridge-tax-audit/parity/mutations.py --verify
          --changed-since "$BASE_SHA" --nightly-issues "$RUNNER_TEMP/nightly-issues.txt"

  required-checks:
    name: Required checks
    # Always runs so it can report a single, stable required status for branch
    # protection. Workflow consistency is unconditional and must succeed. Other
    # upstream jobs may be legitimately skipped (e.g. native/bundle on docs-only
    # PRs), but any failure or cancellation fails this job. Point branch
    # protection at this context instead of the individual matrix jobs so
    # docs-only PRs are not blocked by skipped native/bundle checks.
    # tax-audit-mutations is required too, on pull requests that touch the
    # crate: it runs the mutation runner's tests and `--verify` (no build), so a
    # bridge-tax-audit change merges only with its selected mutations proven on
    # the merged tree. Skipped on other pull requests, which is a pass here.
    if: ${{ always() }}
    needs: [changes, frontend, rust-format, workflow-consistency, tally-portable, native, bundle-smoke, compiler-cache-retention, tax-audit-mutations]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verify no required job failed
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS_JSON"
          failed="$(
            printf '%s' "$NEEDS_JSON" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); failed=[k for k,v in d.items() if v.get('result') in ('failure','cancelled')]; failed += [] if d.get('workflow-consistency', {}).get('result') == 'success' else ['workflow-consistency']; print(' '.join(dict.fromkeys(failed)))"
          )"
          if [[ -n "$failed" ]]; then
            echo "Required jobs did not pass: $failed"
            exit 1
          fi
          echo "All required jobs succeeded or were legitimately skipped."
