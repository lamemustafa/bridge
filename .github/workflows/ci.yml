name: Bridge CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Determine bundle scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      bundle: ${{ steps.scope.outputs.bundle }}
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo 'bundle=true' >> "$GITHUB_OUTPUT"
            echo 'native=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          # A new branch has no useful predecessor. Keep the conservative path.
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo 'bundle=true' >> "$GITHUB_OUTPUT"
            echo 'native=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$base" "$GITHUB_SHA")"
          if printf '%s\n' "$changed_files" | grep -Eq '^(\.github/workflows/ci\.yml|\.github/actions/setup-windows-native/|rust-toolchain\.toml|src-tauri/|tools/)'; then
            echo 'native=true' >> "$GITHUB_OUTPUT"
          else
            echo 'native=false' >> "$GITHUB_OUTPUT"
          fi

          # tools/ is deliberately excluded: it is not shipped in the bundle, which validates the artifact and its resources.
          if printf '%s\n' "$changed_files" | grep -Eq '^(\.github/workflows/ci\.yml|\.github/actions/setup-windows-native/|packaging/mcpb/|package\.json|pnpm-lock\.yaml|\.node-version|vite\.config\.ts|tsconfig\.json|postcss\.config\.js|index\.html|src/|src-tauri/(src/|crates/|Cargo\.lock|Cargo\.toml|.*/Cargo\.toml|tauri\.conf\.json|build\.rs|icons/)|LICENSE$|NOTICE$|THIRD_PARTY_LICENSES\.txt$|THIRD_PARTY_LICENSES_RUST\.txt$|scripts/(capture-package-log(\.test)?\.py|check-mcpb-bundle(\.test)?\.py|package-mcpb\.mjs|check-license-metadata\.mjs|check-dependency-inventory\.mjs|check-windows-bundle-resources\.ps1|check-macos-bundle-resources(\.mutation)?\.mjs)$)'; then
            echo 'bundle=true' >> "$GITHUB_OUTPUT"
          else
            echo 'bundle=false' >> "$GITHUB_OUTPUT"
          fi

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run license:check
      - run: corepack pnpm exec playwright install chromium
      - run: corepack pnpm test
      - run: corepack pnpm run build

  rust-format:
    name: Rust format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: node scripts/check-dependency-inventory.mjs --rust

  workflow-consistency:
    name: Workflow consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # check-protocol-section-numbers.mjs compares the reference against its
          # base to enforce never-renumber; a shallow clone has no base to read,
          # and the check says so and skips rather than passing quietly.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0
      - run: node scripts/check-ci-workflow-consistency.mjs
      - run: node scripts/check-protocol-section-numbers.mjs
      - run: node scripts/check-protocol-section-numbers.test.mjs
      - run: node --test scripts/prune-package-compiler-cache.test.mjs
      - run: python3 scripts/collect-macos-test-crashes.test.py
      - run: python3 scripts/retain-macos-test-binaries.test.py
      - run: python3 scripts/bank_statement_import.test.py
      - run: python3 scripts/sanitise-bbox-capture.test.py
      - run: python3 scripts/merge-gate.test.py

  tally-portable:
    name: Tally portable core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            src-tauri -> target
            tools -> target
      - name: Test portable Tally truth layer
        working-directory: src-tauri
        run: >-
          cargo test --locked --no-fail-fast
          -p bridge-tally-core
          -p bridge-tally-protocol
          -p bridge-tally-transport
          -p tally-protocol-simulator
      - name: Test portable Tally qualification tools
        working-directory: tools
        run: cargo test --locked --workspace --no-fail-fast
      - name: Test disabled protocol evidence features
        working-directory: src-tauri
        run: >-
          cargo test --locked -p bridge-tally-protocol --no-fail-fast
          --features jsonex-parser,jsonex-request-builder,india-tax-observation-parser,bills-payments-observation-parser,bills-native-outstandings-probe
      - name: Test isolated native outstandings qualification path
        working-directory: tools
        run: |
          cargo test --locked -p bridge-tally-compatibility --features bills-native-outstandings-probe-receipt
          cargo test --locked -p bridge-tally-read-transport --features bills-native-outstandings-probe-transport
          cargo test --locked -p bridge-tally-live-read --features bills-native-outstandings-probe-runner -- --test-threads=1
      - name: Lint portable Tally truth layer
        working-directory: src-tauri
        run: >-
          cargo clippy --locked
          -p bridge-tally-core
          -p bridge-tally-protocol
          -p bridge-tally-transport
          -p tally-protocol-simulator
          --all-targets -- -D warnings
      - name: Lint portable Tally qualification tools
        working-directory: tools
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Lint disabled protocol evidence features
        working-directory: src-tauri
        run: >-
          cargo clippy --locked -p bridge-tally-protocol
          --features jsonex-parser,jsonex-request-builder,india-tax-observation-parser,bills-payments-observation-parser,bills-native-outstandings-probe
          --all-targets -- -D warnings
      - name: Lint isolated native outstandings qualification path
        working-directory: tools
        run: |
          cargo clippy --locked -p bridge-tally-compatibility --features bills-native-outstandings-probe-receipt --all-targets -- -D warnings
          cargo clippy --locked -p bridge-tally-read-transport --features bills-native-outstandings-probe-transport --all-targets -- -D warnings
          cargo clippy --locked -p bridge-tally-live-read --features bills-native-outstandings-probe-runner --all-targets -- -D warnings
      - name: Produce parser-only synthetic qualification smoke receipt
        working-directory: tools
        run: >-
          cargo run --locked --release -p bridge-tally-qualification --
          run ci-smoke target/tally-qualification-smoke.json 7 3
      - name: Enforce exact Tally compatibility claims
        working-directory: tools
        run: >-
          cargo run --locked -p bridge-tally-compatibility --
          gate
          ../docs/tally/compatibility/compatibility-matrix.json
          ../docs/tally/compatibility/compatibility-surface.json
          ../docs/tally/compatibility/trusted-evidence-keys.json
          ../docs/tally/compatibility/evidence
          ..
      - name: Reject generated Tally matrix drift
        working-directory: tools
        run: >-
          cargo run --locked -p bridge-tally-compatibility --
          check-matrix-markdown
          ../docs/tally/compatibility/compatibility-matrix.json
          ../docs/tally/support-matrix.md
      - name: Enforce no-write live-read dependency boundary
        run: node scripts/check-tally-live-read-boundary.mjs
      - name: Enforce fixture byte integrity
        run: node scripts/check-fixture-byte-integrity.mjs
      - name: Enforce Tally request-builder hazard allowlist
        run: node scripts/check-tally-request-builder-hazards.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tally-parser-qualification-smoke
          path: tools/target/tally-qualification-smoke.json
          if-no-files-found: error
          retention-days: 7

  native:
    name: Native checks (${{ matrix.os }})
    needs: changes
    # Rust/Tauri changes always receive Windows and macOS coverage on PRs. The
    # check is deliberately skipped only for frontend- and documentation-only PRs.
    if: github.event_name != 'pull_request' || needs.changes.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    # CI does not debug native test executables. Keep local line tables and
    # release profiles unchanged; assertions and overflow checks stay enabled.
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    # A cold Windows native build already consumed the former 35-minute budget
    # before the final isolated qualification test could complete. Keep a hard
    # bound, but reserve time for every required compile, test, and lint gate.
    timeout-minutes: 50
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0
          components: clippy
      - name: Install pinned nextest
        uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with:
          tool: cargo-nextest@0.9.143
          fallback: none
      - name: Set up Windows native prerequisites
        id: windows-native-prerequisites
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-native
        with:
          save-cache: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        id: native-cache
        with:
          workspaces: |
            src-tauri -> target
            tools -> target
          # Separate the Windows dependency artifacts from the former registry-only
          # cache. Keep Cargo/toolchain/profile fingerprints and cleanup defaults;
          # workspace binaries and incremental artifacts are not persisted.
          key: ${{ runner.os == 'Windows' && format('native-deps-v1-{0}', hashFiles('.github/actions/setup-windows-native/action.yml')) || '' }}
          env-vars: ${{ runner.os == 'Windows' && 'ImageOS ImageVersion OPENSSL LIBCLANG' || '' }}
          # PRs consume trusted base caches. Manual branch runs can measure cold
          # and warm reuse in their own scope before a change reaches master.
          save-if: ${{ runner.os != 'Windows' || github.event_name != 'pull_request' }}
      - name: Record Windows prerequisite cache state
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### Windows native cache'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Dependency cache exact hit: `${{ steps.native-cache.outputs.cache-hit }}`'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Runner image: $env:ImageOS / $env:ImageVersion"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Strawberry Perl cache hit: `${{ steps.windows-native-prerequisites.outputs.cache-hit }}`'
      - name: Mark macOS test crash capture boundary
        id: native-crash-boundary
        if: runner.os == 'macOS'
        run: touch "$RUNNER_TEMP/bridge-native-start"
      - name: Test native workspace
        id: native-tests
        run: >-
          cargo nextest run --locked --manifest-path src-tauri/Cargo.toml
          --workspace --no-fail-fast --retries 0 --test-threads num-cpus --timings
      - name: Collect minimized macOS test crash stacks
        if: ${{ always() && runner.os == 'macOS' && steps.native-crash-boundary.outcome == 'success' }}
        run: >-
          python3 scripts/collect-macos-test-crashes.py
          --since-file "$RUNNER_TEMP/bridge-native-start"
          --output "$RUNNER_TEMP/bridge-native-crashes.json"
          --wait-seconds ${{ steps.native-tests.outcome == 'failure' && '30' || '0' }}
      - name: Retain minimized macOS test crash stacks
        if: ${{ always() && runner.os == 'macOS' && steps.native-crash-boundary.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-crash-stacks-macos
          path: ${{ runner.temp }}/bridge-native-crashes.json
          if-no-files-found: error
          retention-days: 7
      - name: Link failed macOS test images to retained executables
        if: ${{ always() && runner.os == 'macOS' && steps.native-tests.outcome == 'failure' }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/retain-macos-test-binaries.py
          --crash-json "$RUNNER_TEMP/bridge-native-crashes.json"
          --target src-tauri/target/debug/deps
          --output "$RUNNER_TEMP/bridge-native-binaries"
      - name: Retain failed macOS executable evidence
        if: ${{ always() && runner.os == 'macOS' && steps.native-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-crash-binaries-macos
          path: ${{ runner.temp }}/bridge-native-binaries
          if-no-files-found: error
          retention-days: 7
      # Nextest does not execute doctests. Keep these as a separate required step.
      - name: Test native workspace doctests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --workspace --doc --no-fail-fast
      - name: Test Tally qualification tools workspace
        working-directory: tools
        run: cargo test --locked --workspace --no-fail-fast
      - name: Test isolated native outstandings qualification feature
        working-directory: tools
        run: >-
          cargo test --locked -p bridge-tally-live-read
          --features bills-native-outstandings-probe-runner
          --all-targets -- --test-threads=1
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --workspace --all-targets --timings -- -D warnings
      - name: Lint Tally qualification tools workspace
        working-directory: tools
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Lint isolated native outstandings qualification feature
        working-directory: tools
        run: >-
          cargo clippy --locked -p bridge-tally-live-read
          --features bills-native-outstandings-probe-runner
          --all-targets -- -D warnings

      - name: Retain native compiler timings
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-compiler-timings-${{ matrix.os }}
          path: src-tauri/target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 7

  bundle-smoke:
    name: Bundle smoke (${{ matrix.os }})
    needs: changes
    # Bundle output is validated for packaging-relevant pull requests and every
    # master/manual run. Rust/Tauri PRs retain the native platform matrix above.
    if: github.event_name != 'pull_request' || needs.changes.outputs.bundle == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.cache/bridge-package-sccache
      SCCACHE_CACHE_SIZE: 64M
      SCCACHE_LOCAL_RW_MODE: ${{ github.ref == 'refs/heads/master' && 'READ_WRITE' || 'READ_ONLY' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0
      - name: Match macOS cache inputs to the Tauri deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const target = config.bundle?.macOS?.minimumSystemVersion;
          if (typeof target !== 'string' || !/^\d+\.\d+(?:\.\d+)?$/.test(target)) {
            throw new Error('Expected an explicit macOS minimumSystemVersion in tauri.conf.json');
          }
          appendFileSync(process.env.GITHUB_ENV, `MACOSX_DEPLOYMENT_TARGET=${target}\n`);
          JS
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          # Tauri sets this inside its process; include it before cache lookup so
          # artifacts from a plain Cargo build cannot masquerade as a warm bundle.
          env-vars: ${{ runner.os == 'macOS' && 'MACOSX_DEPLOYMENT_TARGET' || '' }}
      - name: Set up Windows native prerequisites
        id: windows-bundle-prerequisites
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-native
      - name: Record Windows prerequisite cache state
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### Windows native prerequisites'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Strawberry Perl cache hit: `${{ steps.windows-bundle-prerequisites.outputs.cache-hit }}`'
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run license:all
      - name: Install pinned package compiler cache
        id: package-sccache
        uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with:
          tool: sccache@0.17.0
          fallback: none
      - name: Restore package compiler objects
        id: package-sccache-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: bridge-package-sccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            bridge-package-sccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}-
      - name: Start package compiler cache statistics
        id: package-sccache-start
        run: sccache --zero-stats
      - name: Use ad-hoc signing for macOS smoke bundles
        if: runner.os == 'macOS'
        run: echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
      - run: corepack pnpm run tauri:build
        if: runner.os != 'macOS'
        env:
          CARGO_INCREMENTAL: '0'
          RUSTC_WORKSPACE_WRAPPER: sccache
      - name: Build macOS bundles with child diagnostics
        id: macos-bundle
        if: runner.os == 'macOS'
        env:
          CARGO_INCREMENTAL: '0'
          RUSTC_WORKSPACE_WRAPPER: sccache
          # Pinned Tauri CLI logs bundle_dmg.sh stdout/stderr only at debug.
          TAURI_CLI_VERBOSITY: '1'
        run: |
          python3 scripts/capture-package-log.test.py
          set -o pipefail
          corepack pnpm run tauri:build -- --timings 2>&1 | python3 scripts/capture-package-log.py
      - name: Collect failed macOS bundle context
        if: ${{ failure() && runner.os == 'macOS' && steps.macos-bundle.outcome == 'failure' }}
        run: |
          mkdir -p package-diagnostics
          hdiutil info > package-diagnostics/disk-images.txt 2>&1
          df -h . > package-diagnostics/disk-space.txt 2>&1
      - name: Retain macOS package diagnostics
        if: ${{ always() && runner.os == 'macOS' && (steps.macos-bundle.outcome == 'success' || steps.macos-bundle.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-package-diagnostics
          path: |
            package-diagnostics/**
            src-tauri/target/release/bundle/dmg/bundle_dmg.sh
            src-tauri/target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 7
      - name: Verify Windows installer legal resources
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-windows-bundle-resources.ps1
      - name: Verify macOS app legal resources and signature
        if: runner.os == 'macOS'
        run: |
          node scripts/check-macos-bundle-resources.mjs
          node scripts/check-macos-bundle-resources.mutation.mjs
      # tauri build uses --bins, including the auto-discovered bridge_mcp.
      # Stage that fresh release binary instead of rebuilding without Tauri's
      # custom-protocol feature and native build environment.
      - name: Stage host MCPB binary and legal resources
        run: node scripts/package-mcpb.mjs --binary src-tauri/target/release/bridge_mcp${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Validate and pack MCPB with the official schema
        run: |
          npx --yes @anthropic-ai/mcpb@2.1.2 validate packaging/mcpb/stage/manifest.json
          npx --yes @anthropic-ai/mcpb@2.1.2 pack packaging/mcpb/stage src-tauri/target/release/bundle/bridge-tally.mcpb
          npx --yes @anthropic-ai/mcpb@2.1.2 info src-tauri/target/release/bundle/bridge-tally.mcpb
      - name: Exercise the packaged MCPB stdio server
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python_command=python
          else
            python_command=python3
          fi
          "$python_command" scripts/check-mcpb-bundle.test.py
          "$python_command" scripts/check-mcpb-bundle.py src-tauri/target/release/bundle/bridge-tally.mcpb --output src-tauri/target/release/bundle/mcpb-smoke.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-bundle-smoke-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 7
      - name: Retain package compiler cache statistics
        id: package-sccache-stats
        if: ${{ always() && steps.package-sccache-start.outcome == 'success' }}
        shell: bash
        run: |
          sccache --show-stats --stats-format json > package-compiler-cache.json
          sccache --stop-server
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const writes = JSON.parse(readFileSync('package-compiler-cache.json', 'utf8')).stats.cache_writes;
          if (!Number.isSafeInteger(writes) || writes < 0) throw new Error('Invalid compiler-cache write count');
          appendFileSync(process.env.GITHUB_OUTPUT, `has-writes=${writes > 0}\n`);
          JS
      - name: Upload package compiler cache statistics
        if: ${{ always() && steps.package-sccache-start.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-compiler-cache-${{ matrix.os }}
          path: package-compiler-cache.json
          if-no-files-found: error
          retention-days: 7
      - name: Save qualified master compiler objects
        if: ${{ success() && github.ref == 'refs/heads/master' && steps.package-sccache-stats.outputs.has-writes == 'true' && steps.package-sccache-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ steps.package-sccache-cache.outputs.cache-primary-key }}

  compiler-cache-retention:
    name: Retain two compiler-cache snapshots per OS
    needs: [bundle-smoke, workflow-consistency]
    if: ${{ always() && github.ref == 'refs/heads/master' && needs.workflow-consistency.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    concurrency:
      group: package-compiler-cache-retention
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
      - name: Prune only obsolete master package compiler objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prune-package-compiler-cache.mjs --apply

  required-checks:
    name: Required checks
    # Always runs so it can report a single, stable required status for branch
    # protection. Passes when every upstream job either succeeded or was
    # legitimately skipped (e.g. native/bundle skip on docs-only PRs), and fails
    # if any upstream job failed or was cancelled. Point branch protection at
    # this context instead of the individual matrix jobs so docs-only PRs are
    # not blocked by skipped native/bundle checks.
    if: ${{ always() }}
    needs: [changes, frontend, rust-format, workflow-consistency, tally-portable, native, bundle-smoke, compiler-cache-retention]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verify no required job failed
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS_JSON"
          failed="$(
            printf '%s' "$NEEDS_JSON" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(' '.join(k for k,v in d.items() if v.get('result') in ('failure','cancelled')))"
          )"
          if [[ -n "$failed" ]]; then
            echo "Required jobs did not pass: $failed"
            exit 1
          fi
          echo "All required jobs succeeded or were legitimately skipped."
